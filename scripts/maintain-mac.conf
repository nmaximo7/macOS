# =============================================================================
# maintain-mac.conf - your settings for maintain-mac.sh
# Lives next to the script:  ~/macOS/scripts/maintain-mac.conf
# =============================================================================
# The script reads this file as shell code, so keep every line as  NAME="value"
# and put nothing else in it (no commands). Anything you remove falls back to the
# default inside maintain-mac.sh. The same names also work as environment
# variables, e.g.  DOWNLOADS_DAYS=60 bash scripts/maintain-mac.sh --run --only downloads
# This file is safe for the public repository: it contains paths only, no secrets.

# --- Where things are ---------------------------------------------------------
DOTFILES="$HOME/macOS"                     # your stow / dotfiles git repository
PY_DIR="$DOTFILES/myPython"                # the Hugo Content Toolkit (venv in .venv)
VOL_MASTER="/Volumes/MacDatosMaster"       # source drive (Hugo site, justtothepoint)
VOL_SLAVE="/Volumes/DatosSlave"            # backup drive
DOWNLOADS="$HOME/Downloads"

# --- Backup (rsync ~/macOS and Master -> Slave) -------------------------------
RSYNC_DELETE=1          # 1 = mirror deletions; deleted/changed files go to a dated history folder
RSYNC_MAX_DELETE=500    # abort a job that would delete more files than this; "unlimited" = no limit
                        # (or run once with:  bash maintain-mac.sh --run --only backup --allow-big-delete)
                        # Time Machine data (Backups.backupdb, *.sparsebundle...) is never copied.
HISTORY_DAYS=60         # keep that history for this many days
RSYNC_EXTRA_EXCLUDES="" # extra patterns, separated by spaces (no spaces inside a pattern)
TM_WAIT=1               # 1 = wait until the Time Machine backup has finished
BREW_DOCTOR_TIMEOUT=120  # give up on "brew doctor" after this many seconds
PYTEST_TIMEOUT=900       # give up on the project tests (pip step) after this many seconds; failing = rollback
HEARTBEAT_SECS=60       # while rsync runs, print a "still copying ... N GB" line this often (0 = never)

# --- Downloads, Trash, browser caches, logs -----------------------------------
DOWNLOADS_DAYS=30       # files untouched this long are moved to quarantine (not deleted yet)
QUARANTINE_DAYS=30      # quarantine batches older than this are deleted
TRASH_ENABLED=1
LOG_DAYS=30             # ~/Library/Logs files older than this are deleted
LOG_KEEP_DAYS=90        # this script's own logs are kept this long
CLEAN_XCODE=0           # 1 = also clear Xcode DerivedData

# --- Homebrew / Python / macOS updates ----------------------------------------
BREW_GREEDY=0           # 1 = also upgrade casks that update themselves (Chrome, VS Code...)
BREW_CLEANUP_DAYS=30
PIP_UPGRADE=1           # 0 = only check, never upgrade (tests run; rollback if they fail)
INSTALL_OS_UPDATES=0    # 1 = `sudo softwareupdate -i -a` (no restart)
MAS_UPGRADE=0           # 1 = upgrade App Store apps with `mas`

# --- Git (add . / commit with the date / push) --------------------------------
COMMIT_PREFIX="maintain-mac:"
GIT_PULL=1              # 1 = git pull --rebase --autostash before pushing
MAX_FILE_MB=50          # refuse to commit files bigger than this

# --- Health-check thresholds --------------------------------------------------
DISK_WARN_PCT=85
MIN_FREE_GB=20
MEM_FREE_WARN_PCT=15
