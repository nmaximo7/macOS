name: Tests

on:
  push:
    paths: ["myPython/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["myPython/**", ".github/workflows/tests.yml"]
  workflow_dispatch:          # adds a "Run workflow" button

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: myPython
    steps:
      - uses: actions/checkout@v4          # download your repo
      - uses: actions/setup-python@v5      # install Python
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: myPython/requirements.txt
      - name: Install packages
        run: python -m pip install -r requirements.txt pytest
      - name: Run the tests
        run: python -m pytest
      - name: Environment summary
        if: always()
        run: |
          {
            echo "### Test environment"
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| Python | `$(python --version 2>&1)` |"
            echo "| OS | `$(uname -s)` |"
            echo "| Commit | `$GITHUB_SHA` |"
          } >> "$GITHUB_STEP_SUMMARY"
