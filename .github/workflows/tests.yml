name: Tests

on:
  push:
    paths: ["myPython/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["myPython/**", ".github/workflows/tests.yml"]
  workflow_dispatch:          # adds a "Run workflow" button

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myPython
    steps:
      - uses: actions/checkout@v4          # download your repo
      - uses: actions/setup-python@v5      # install Python
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: myPython/requirements.txt
      - name: Install packages
        run: python -m pip install -r requirements.txt pytest
      - name: Run the tests
        run: python -m pytest
