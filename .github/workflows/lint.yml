name: Lint

on:
  push:
    paths: ["myPython/**", ".github/workflows/lint.yml"]
  pull_request:
    paths: ["myPython/**", ".github/workflows/lint.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: myPython
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
